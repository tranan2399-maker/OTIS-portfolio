# Tên của workflow
name: Deploy to GitHub Pages

# Kích hoạt khi có code đẩy lên nhánh main
on:
  push:
    branches:
      - main
  # Cho phép chạy thủ công từ tab Actions
  workflow_dispatch:

# Cấp quyền đọc/ghi cho GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Hủy các lượt chạy cũ nếu có lượt mới
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Cài đặt thư viện
        run: npm ci || npm install
        
      - name: Build ứng dụng
        run: npm run build
        
      - name: Tải lên thư mục dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Job Deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
